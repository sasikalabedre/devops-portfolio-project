<!DOCTYPE html>
<html>
<head>
    <title>DevOps Portfolio</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        .container { max-width: 600px; }
        button { padding: 10px 20px; margin: 10px 0; cursor: pointer; }
        #response { background: #f0f0f0; padding: 10px; margin-top: 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>DevOps Portfolio App</h1>
        <p>Frontend Service Running</p>
        <button onclick="callHomeAPI()">Call API Home</button>
        <button onclick="callHealthAPI()">Call API Health</button>
        <div id="response">Response will appear here...</div>
    </div>

    <script>
        async function callHomeAPI() {
            try {
                const response = await fetch('http://localhost:5000/');
                const data = await response.json();
                document.getElementById('response').innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('response').innerText = 'Error: ' + error.message;
            }
        }

        async function callHealthAPI() {
            try {
                const response = await fetch('http://localhost:5000/health');
                const data = await response.json();
                document.getElementById('response').innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('response').innerText = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
